<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi receta y comprobante — María José Tapia Odontóloga</title>
<style>
  :root{
    --bg:#FFFCFB; --surface:#FFFFFF; --cream:#F7ECDE; --ink:#3A2E2E; --ink-soft:#8A7A74;
    --line:#EFE1D4; --pink:#D98A9B; --pink-dark:#B96A7C;
  }
  :root[data-theme="dark"]{
    --bg:#241B1D; --surface:#2E2225; --cream:#3A2B2A; --ink:#F5E9E4; --ink-soft:#BFA8A2;
    --line:#4A3634; --pink:#E8A4B4; --pink-dark:#F2B8C6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);
  }
  main{ max-width:720px; margin:0 auto; padding-top:20px; }

  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .top-bar img{ width:36px; height:36px; object-fit:contain; border-radius:8px; }
  .top-bar b{ font-size:15px; }
  .top-bar span{ display:block; font-size:12px; color:var(--ink-soft); }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab{
    flex:1; text-align:center; padding:12px; border-radius:10px; font-weight:700; font-size:14px;
    background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
  }
  .tab.active{ background:var(--pink); color:#fff; border-color:var(--pink); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; }
  .hint{ font-size:13px; color:var(--ink-soft); }

  /* Receta */
  .receta-doc{ background:var(--surface); border:2px solid var(--ink); border-radius:4px; padding:24px; }
  .receta-header{ display:flex; align-items:center; gap:14px; }
  .receta-header img{ width:54px; height:54px; object-fit:contain; }
  .receta-header h2{ margin:0; font-size:17px; }
  .receta-header .especialidad{ font-size:13px; color:var(--ink-soft); }
  .receta-linea{ height:3px; background:var(--pink); margin:14px 0 18px; border-radius:2px; }
  .receta-campo{ margin-bottom:8px; font-size:14px; }
  .rp{ font-size:20px; font-weight:800; color:var(--pink-dark); margin:12px 0 4px; }
  .med-list{ margin:0; padding-left:18px; font-size:14px; line-height:1.9; }

  /* Comprobante */
  .resumen-pagos{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .resumen-item{ flex:1; min-width:130px; background:var(--cream); border-radius:10px; padding:12px; text-align:center; }
  .resumen-item .monto{ font-size:19px; font-weight:800; }
  .resumen-item .etiqueta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .resumen-item.pendiente .monto{ color:var(--pink-dark); }

  table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th{ text-align:left; color:var(--ink-soft); font-size:11px; padding:7px 5px; border-bottom:1px solid var(--line); }
  td{ padding:9px 5px; border-bottom:1px solid var(--line); vertical-align:top; }
  .thumb{ width:40px; height:40px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }

  .loyalty-row{ display:flex; gap:7px; margin-top:8px; }
  .dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--cream); color:var(--ink-soft); border:1px solid var(--line); }
  .dot.filled{ background:var(--pink); color:#fff; border-color:var(--pink); }

  .estado-carga{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
</style>
</head>
<body>
<main id="app">
  <div class="estado-carga" id="cargando">Cargando tu información…</div>
</main>

<script>
  // Debe ser la misma URL de despliegue que usa el panel del consultorio.
  const CONFIG = { APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbznpX-f_N7MvaLxodfZDJthEZ__hkfXVM-_E49O3xcM7c8zGaeB_emfdx-aY-_TxtE8/exec' };

  function formatearFechaBonita(fechaISO){
    const partes = (fechaISO || '').split('-');
    if(partes.length !== 3) return fechaISO || '—';
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }

  async function cargar(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const app = document.getElementById('app');

    if(!id){
      app.innerHTML = '<div class="estado-carga">Este link no tiene la información necesaria. Verifica el link con tu clínica.</div>';
      return;
    }

    try{
      const resp = await fetch(CONFIG.APPS_SCRIPT_URL + '?pacienteId=' + encodeURIComponent(id));
      const data = await resp.json();
      if(data.error){
        app.innerHTML = '<div class="estado-carga">No se encontró tu información. Verifica el link con tu clínica.</div>';
        return;
      }
      pintar(data);
    }catch(err){
      app.innerHTML = '<div class="estado-carga">No se pudo cargar tu información. Revisa tu conexión a internet e intenta de nuevo.</div>';
    }
  }

  function pintar(data){
    const app = document.getElementById('app');
    const r = data.ultimaReceta;
    const medicamentos = r && r.receta ? r.receta.split('\n').map(l => l.trim()).filter(Boolean) : [];

    const filasVisitas = (data.visitas || []).map(v => `
      <tr>
        <td>${formatearFechaBonita(v.fecha)}</td>
        <td>${v.tratamiento || '—'}</td>
        <td>$${(v.abono||0).toFixed(2)}</td>
        <td>${v.depositoFotoUrl ? `<a href="${v.depositoFotoUrl}" target="_blank"><img src="${v.depositoFotoUrl}" class="thumb"></a>` : '—'}</td>
        <td>${v.pdfUrl ? `<a href="${v.pdfUrl}" target="_blank">Ver PDF</a>` : '—'}</td>
      </tr>
    `).join('');

    const visitas = data.visitas || [];
    const enCiclo = visitas.length % 5;
    const posicionActual = enCiclo === 0 ? (visitas.length > 0 ? 5 : 0) : enCiclo;
    const dots = Array.from({length:5}, (_, i) => `<div class="dot ${i < posicionActual ? 'filled' : ''}">${i === 4 ? '★' : i+1}</div>`).join('');

            <div class="receta-campo"><b>Paciente:</b> ${data.paciente.nombre}</div>
            <div class="receta-campo"><b>Fecha:</b> ${formatearFechaBonita(r.fecha)}</div>

          <h2 style="margin:0 0 4px;font-size:16px;">${data.paciente.nombre}</h2>
          <p class="hint" style="margin:0;">Resumen de pagos</p>
          <div class="resumen-pagos">
            <div class="resumen-item"><div class="monto">$${data.resumen.valorTratamiento.toFixed(2)}</div><div class="etiqueta">Valor tratamiento</div></div>
            <div class="resumen-item"><div class="monto">$${data.resumen.totalAbonado.toFixed(2)}</div><div class="etiqueta">Abonado</div></div>
            <div class="resumen-item pendiente"><div class="monto">$${data.resumen.pendiente.toFixed(2)}</div><div class="etiqueta">Pendiente</div></div>
          </div>
        </div>

        <div class="card">
          <h2 style="margin:0 0 4px;font-size:14.5px;">Historial de sesiones</h2>
          ${filasVisitas ? `
            <table>
              <thead><tr><th>Fecha</th><th>Tratamiento</th><th>Abono</th><th>Depósito</th><th>PDF</th></tr></thead>
              <tbody>${filasVisitas}</tbody>
            </table>
          ` : '<p class="hint">Aún no hay sesiones registradas.</p>'}
        </div>

        ${visitas.length ? `
          <div class="card">
            <h2 style="margin:0 0 4px;font-size:14.5px;">Fidelización</h2>
            <p class="hint">${visitas.length} visita(s) registradas.</p>
            <div class="loyalty-row">${dots}</div>
          </div>
        ` : ''}
      </div>
    `;

    document.getElementById('tabReceta').addEventListener('click', () => cambiarTab('Receta'));
    document.getElementById('tabComprobante').addEventListener('click', () => cambiarTab('Comprobante'));
  }

  function cambiarTab(nombre){
    ['Receta','Comprobante'].forEach(n => {
      document.getElementById('tab'+n).classList.toggle('active', n === nombre);
      document.getElementById('panel'+n).classList.toggle('active', n === nombre);
    });
  }

  cargar();
</script>
