<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Dra. Tapia">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<title>Mi receta y comprobante — María José Tapia Odontóloga</title>
<style>
  :root{
    --bg:#FFFCFB; --surface:#FFFFFF; --cream:#F7ECDE; --ink:#3A2E2E; --ink-soft:#8A7A74;
    --line:#EFE1D4; --pink:#D98A9B; --pink-dark:#B96A7C;
  }
  :root[data-theme="dark"]{
    --bg:#241B1D; --surface:#2E2225; --cream:#3A2B2A; --ink:#F5E9E4; --ink-soft:#BFA8A2;
    --line:#4A3634; --pink:#E8A4B4; --pink-dark:#F2B8C6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);
  }
  main{ max-width:720px; margin:0 auto; padding-top:20px; }

  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .top-bar img{ width:36px; height:36px; object-fit:contain; border-radius:8px; }
  .top-bar b{ font-size:15px; }
  .top-bar span{ display:block; font-size:12px; color:var(--ink-soft); }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab{
    flex:1; text-align:center; padding:12px; border-radius:10px; font-weight:700; font-size:14px;
    background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
  }
  .tab.active{ background:var(--pink); color:#fff; border-color:var(--pink); }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; }
  .hint{ font-size:13px; color:var(--ink-soft); }

  /* Receta */
  .receta-doc{ background:var(--surface); border:2px solid var(--ink); border-radius:4px; padding:24px; }
  .receta-header{ display:flex; align-items:center; gap:14px; }
  .receta-header img{ width:54px; height:54px; object-fit:contain; }
  .receta-header h2{ margin:0; font-size:17px; }
  .receta-header .especialidad{ font-size:13px; color:var(--ink-soft); }
  .receta-linea{ height:3px; background:var(--pink); margin:14px 0 18px; border-radius:2px; }
  .receta-campo{ margin-bottom:8px; font-size:14px; }
  .rp{ font-size:20px; font-weight:800; color:var(--pink-dark); margin:12px 0 4px; }
  .med-list{ margin:0; padding-left:18px; font-size:14px; line-height:1.9; }

  /* Comprobante */
  .resumen-pagos{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .resumen-item{ flex:1; min-width:130px; background:var(--cream); border-radius:10px; padding:12px; text-align:center; }
  .resumen-item .monto{ font-size:19px; font-weight:800; }
  .resumen-item .etiqueta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .resumen-item.pendiente .monto{ color:var(--pink-dark); }

  table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th{ text-align:left; color:var(--ink-soft); font-size:11px; padding:7px 5px; border-bottom:1px solid var(--line); }
  td{ padding:9px 5px; border-bottom:1px solid var(--line); vertical-align:top; }
  .thumb{ width:40px; height:40px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }

  .loyalty-row{ display:flex; gap:7px; margin-top:8px; }
  .dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--cream); color:var(--ink-soft); border:1px solid var(--line); }
  .dot.filled{ background:var(--pink); color:#fff; border-color:var(--pink); }


  /* Separaciones divisorias (mismo estilo del reporte PDF) */
  .doc-head{ background:#1a1a1a; color:#fff; border-radius:12px 12px 0 0; padding:16px 18px; display:flex; align-items:center; gap:12px; }
  .doc-head img{ width:42px; height:42px; object-fit:contain; border-radius:8px; background:#fff; }
  .doc-head h2{ margin:0; font-size:17px; } .doc-head p{ margin:2px 0 0; font-size:12px; opacity:.8; }
  .sec{ margin-top:16px; }
  .sec-bar{ background:var(--cream); color:var(--ink); font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.3px; padding:7px 12px; border-radius:6px; }
  .sec-body{ padding:10px 6px 0; font-size:14px; }
  .fila{ display:flex; gap:10px; margin:6px 0; font-size:14px; }
  .fila .lbl{ width:130px; color:var(--ink-soft); flex-shrink:0; }
  .galeria{ display:flex; flex-wrap:wrap; gap:8px; }
  .galeria img{ width:calc(33.3% - 6px); aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
  .galeria.dep img{ width:calc(50% - 4px); aspect-ratio:auto; max-height:420px; object-fit:contain; background:var(--cream); }
  .btn{ display:inline-block; border:0; background:var(--pink); color:#fff; font-weight:700; font-size:14px; padding:12px 18px; border-radius:10px; cursor:pointer; }
  .btn.sec2{ background:var(--surface); color:var(--pink-dark); border:1px solid var(--pink); }
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .lb{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:50; }
  .lb.show{ display:flex; } .lb img{ max-width:96vw; max-height:92vh; border-radius:8px; }
  @media print{
    body{ background:#fff !important; color:#000 !important; }
    body.print-receta .top-bar, body.print-receta .tabs, body.print-receta .no-print, body.print-receta #panelComprobante{ display:none !important; }
    body.print-receta #panelReceta{ display:block !important; }
    body.print-receta .receta-doc, body.print-receta .doc-head, body.print-receta .sec-bar{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .receta-doc{ border-color:#000 !important; background:#fff !important; color:#000 !important; }
  }
  .estado-carga{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
</style>
</head>
<body>
<main id="app">
  <div class="estado-carga" id="cargando">Cargando tu información…</div>
</main>

<script>
  // Debe ser la misma URL de despliegue que usa el panel del consultorio.
  const CONFIG = { APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbznpX-f_N7MvaLxodfZDJthEZ__hkfXVM-_E49O3xcM7c8zGaeB_emfdx-aY-_TxtE8/exec' };

  function formatearFechaBonita(fechaISO){
    const partes = String(fechaISO || '').slice(0,10).split('-');
    if(partes.length !== 3) return fechaISO || '—';
    return partes[2] + '/' + partes[1] + '/' + partes[0];
  }

  async function cargar(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const app = document.getElementById('app');

    if(!id){
      app.innerHTML = '<div class="estado-carga">Este link no tiene la información necesaria. Verifica el link con tu clínica.</div>';
      return;
    }

    try{
      const resp = await fetch(CONFIG.APPS_SCRIPT_URL + '?pacienteId=' + encodeURIComponent(id) + '&t=' + Date.now(), { cache: 'no-store' });
      const data = await resp.json();
      if(data.error){
        app.innerHTML = '<div class="estado-carga">No se encontró tu información. Verifica el link con tu clínica.</div>';
        return;
      }
      pintar(data);
    }catch(err){
      app.innerHTML = '<div class="estado-carga">No se pudo cargar tu información. Revisa tu conexión a internet e intenta de nuevo.</div>';
    }
  }

  // ================= PDF ÚNICO CON TODO (depósito + tratamiento + receta + fotos) =================
  function pdfListaUrls(x){
    if(!x) return [];
    if(Array.isArray(x)) return x.filter(Boolean);
    const s = String(x).trim();
    if(s.startsWith('[')){ try{ return JSON.parse(s).filter(Boolean); }catch(e){} }
    if(s.includes(',http')) return s.split(',').map(t => t.trim()).filter(Boolean);
    return s ? [s] : [];
  }

  function pdfCargarImagen(url){
    const intento = (src) => new Promise((resolve) => {
      const img = new Image();
      if(!src.startsWith('data:')) img.crossOrigin = 'anonymous';
      const t = setTimeout(() => resolve(null), 20000);
      img.onload = () => {
        clearTimeout(t);
        try{
          const w0 = img.naturalWidth, h0 = img.naturalHeight;
          if(!w0 || !h0) return resolve(null);
          const k = Math.min(1, 1200 / Math.max(w0, h0));
          const c = document.createElement('canvas');
          c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          resolve({ data: c.toDataURL('image/jpeg', 0.8), w: c.width, h: c.height });
        }catch(e){ resolve(null); }
      };
      img.onerror = () => { clearTimeout(t); resolve(null); };
      img.src = src;
    });
    return (async () => {
      if(!url) return null;
      let r = await intento(url);
      if(r) return r;
      const m = String(url).match(/(?:\/d\/|[?&]id=)([\w-]{20,})/);
      if(m) r = await intento('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200');
      return r;
    })();
  }

  async function generarPdfCompleto({ paciente, visitas, valorTratamiento, receta }){
    if(!window.jspdf) throw new Error('No cargó la librería de PDF. Revisa tu conexión.');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const PW = 210, PH = 297, M = 15, CW = PW - 2 * M;
    let y = 0;

    const fmtFecha = (f) => {
      const p = String(f || '').slice(0, 10).split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : (f || '—');
    };
    const money = (n) => '$' + Number(n || 0).toFixed(2);
    const limpiar = (s) => String(s == null ? '' : s).replace(/\r/g, '');
    const ensure = (h) => { if(y + h > PH - 18){ doc.addPage(); y = M; } };

    const barra = (titulo) => {
      ensure(18); y += 4;
      doc.setFillColor(240, 240, 240); doc.rect(M, y, CW, 7, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(51, 51, 51);
      doc.text(String(titulo).toUpperCase(), M + 3, y + 4.9);
      y += 11;
    };
    const fila = (label, valor) => {
      const lines = doc.splitTextToSize(limpiar(valor) || '—', CW - 48);
      ensure(Math.max(6, lines.length * 5));
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(130, 130, 130);
      doc.text(label, M + 3, y);
      doc.setFontSize(10); doc.setTextColor(30, 30, 30);
      doc.text(lines, M + 45, y);
      y += Math.max(6, lines.length * 5);
    };
    const parrafo = (txt) => {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(30, 30, 30);
      doc.splitTextToSize(limpiar(txt), CW - 6).forEach(l => { ensure(5.5); doc.text(l, M + 3, y); y += 5.2; });
      y += 1;
    };
    const galeria = async (urls, cols) => {
      const imgs = [];
      for(const u of urls){ imgs.push({ img: await pdfCargarImagen(u), url: u }); }
      const gap = 4, cw = (CW - gap * (cols - 1)) / cols, maxH = 70;
      for(let i = 0; i < imgs.length; i += cols){
        const fila = imgs.slice(i, i + cols).map(o => {
          if(!o.img) return { w: cw, h: 10, o };
          let w = cw, h = cw * o.img.h / o.img.w;
          if(h > maxH){ h = maxH; w = h * o.img.w / o.img.h; }
          return { w, h, o };
        });
        const alto = Math.max(...fila.map(f => f.h));
        ensure(alto + 4);
        fila.forEach((f, j) => {
          const x = M + j * (cw + gap);
          if(f.o.img){ doc.addImage(f.o.img.data, 'JPEG', x, y, f.w, f.h); }
          else{
            doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(150, 150, 150);
            doc.text('(imagen no disponible)', x, y + 5);
          }
        });
        y += alto + 4;
      }
    };

    // ---- Encabezado oscuro ----
    doc.setFillColor(26, 26, 26); doc.rect(0, 0, PW, 34, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
    doc.text('María José Tapia - Odontóloga', M, 15);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text('Comprobante de tratamiento y pagos', M, 22);
    doc.text('Generado: ' + new Date().toLocaleDateString('es-EC') + ' ' + new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' }), M, 28);
    y = 34;

    const lista = [...(visitas || [])].sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));

    // ---- Datos del paciente ----
    barra('Información del paciente');
    fila('Nombre:', paciente && paciente.nombre);
    if(paciente && paciente.telefono) fila('Teléfono:', paciente.telefono);
    const ultimo = lista[lista.length - 1];
    if(ultimo && ultimo.tratamiento) fila('Tratamiento:', ultimo.tratamiento);

    // ---- Receta ----
    const meds = receta ? limpiar(receta).split('\n').map(l => l.trim().replace(/^[*•\-–]\s*/, '')).filter(Boolean) : [];
    if(meds.length){
      barra('Receta');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(185, 106, 124);
      ensure(7); doc.text('Rp.', M + 3, y); y += 6;
      meds.forEach(m => parrafo('•  ' + m));
    }

    // ---- Comprobante de pago ----
    const totalAbonado = lista.reduce((s, v) => s + (Number(v.abono) || 0), 0);
    const valor = Number(valorTratamiento) || Number((ultimo && ultimo.valorTratamiento) || 0);
    const pendiente = Math.max(valor - totalAbonado, 0);
    barra('Comprobante de pago');
    ensure(24);
    const bw = (CW - 8) / 3;
    [['Valor del tratamiento', valor, false], ['Abonado', totalAbonado, false], ['Pendiente', pendiente, true]].forEach((b, i) => {
      const x = M + i * (bw + 4);
      doc.setFillColor(247, 236, 222); doc.roundedRect(x, y, bw, 20, 2, 2, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
      if(b[2]) doc.setTextColor(185, 106, 124); else doc.setTextColor(40, 40, 40);
      doc.text(money(b[1]), x + bw / 2, y + 9, { align: 'center' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(120, 120, 120);
      doc.text(b[0], x + bw / 2, y + 15, { align: 'center' });
    });
    y += 26;

    if(lista.length){
      ensure(14);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(130, 130, 130);
      doc.text('FECHA', M + 3, y); doc.text('TRATAMIENTO', M + 30, y);
      doc.text('ABONO', M + 120, y, { align: 'right' }); doc.text('SALDO', M + CW - 3, y, { align: 'right' });
      y += 2; doc.setDrawColor(220, 220, 220); doc.line(M, y, M + CW, y); y += 5;
      let acumulado = 0;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30, 30, 30);
      lista.forEach(v => {
        acumulado += Number(v.abono) || 0;
        const saldo = Math.max((Number(v.valorTratamiento) || valor) - acumulado, 0);
        const trat = doc.splitTextToSize(limpiar(v.tratamiento) || '—', 80);
        ensure(trat.length * 5 + 3);
        doc.text(fmtFecha(v.fecha), M + 3, y);
        doc.text(trat, M + 30, y);
        doc.text(money(v.abono), M + 120, y, { align: 'right' });
        doc.text(money(saldo), M + CW - 3, y, { align: 'right' });
        y += trat.length * 5; doc.setDrawColor(235, 235, 235); doc.line(M, y - 2, M + CW, y - 2); y += 2;
      });
    }

    // ---- Una sección por sesión: trabajo realizado, depósito, antes y después ----
    for(const v of lista){
      barra('Sesión del ' + fmtFecha(v.fecha) + ' - Trabajo realizado');
      fila('Tratamiento:', v.tratamiento);
      if(v.notas) fila('Notas:', v.notas);
      fila('Abono de la sesión:', money(v.abono));

      const dep = pdfListaUrls(v.depositoFotoUrl);
      if(dep.length){ barra('Comprobante de depósito'); await galeria(dep, 2); }
      const antes = pdfListaUrls(v.fotoAntesUrl);
      if(antes.length){ barra('Fotos antes'); await galeria(antes, 3); }
      const despues = pdfListaUrls(v.fotoDespuesUrl);
      if(despues.length){ barra('Fotos después'); await galeria(despues, 3); }
    }

    // ---- Pie de página ----
    const n = doc.getNumberOfPages();
    for(let i = 1; i <= n; i++){
      doc.setPage(i);
      doc.setDrawColor(210, 210, 210); doc.line(M, PH - 14, PW - M, PH - 14);
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(150, 150, 150);
      doc.text('Reporte generado por María José Tapia - Odontóloga', M, PH - 9);
      doc.text('Página ' + i + ' de ' + n, PW - M, PH - 9, { align: 'right' });
    }
    return doc;
  }

  async function descargarPdfCompleto(args, boton){
    const textoOriginal = boton ? boton.textContent : '';
    if(boton){ boton.disabled = true; boton.textContent = '⏳ Generando PDF…'; }
    try{
      const doc = await generarPdfCompleto(args);
      const nombre = String((args.paciente && args.paciente.nombre) || 'paciente').replace(/[^\wÁÉÍÓÚáéíóúñÑ ]+/g, '').trim().replace(/\s+/g, '_');
      doc.save('Comprobante_' + nombre + '.pdf');
    }catch(err){
      alert('No se pudo generar el PDF: ' + (err && err.message ? err.message : err));
    }finally{
      if(boton){ boton.disabled = false; boton.textContent = textoOriginal; }
    }
  }

  function pintar(data){
    const app = document.getElementById('app');
    const visitas = [...(data.visitas || [])].sort((a,b) => String(a.fecha).localeCompare(String(b.fecha)));
    const visitasRecientes = [...visitas].reverse();

    // Receta: la última registrada (si el servidor no la manda, se toma de la última visita con receta)
    let r = data.ultimaReceta;
    if(!r || !r.receta){
      const v = visitasRecientes.find(x => x.receta && String(x.receta).trim());
      if(v) r = { receta: v.receta, fecha: v.fecha, tratamiento: v.tratamiento };
    }
    const medicamentos = r && r.receta ? String(r.receta).split('\n').map(l => l.trim().replace(/^[*•\-–]\s*/, '')).filter(Boolean) : [];

    // Resumen de pagos calculado aquí mismo, con los abonos reales de cada sesión
    const ultima = visitasRecientes[0];
    const valor = Number((data.paciente && data.paciente.valorTratamiento) || (ultima && ultima.valorTratamiento) || (data.resumen && data.resumen.valorTratamiento) || 0);
    const totalAbonado = visitas.length ? visitas.reduce((s,v) => s + (Number(v.abono) || 0), 0) : Number((data.resumen && data.resumen.totalAbonado) || 0);
    const pendiente = Math.max(valor - totalAbonado, 0);

    let acumulado = 0;
    const filasPagos = visitas.map(v => {
      acumulado += Number(v.abono) || 0;
      const saldo = Math.max((Number(v.valorTratamiento) || valor) - acumulado, 0);
      return `<tr><td>${formatearFechaBonita(v.fecha)}</td><td>${esc(v.tratamiento) || '—'}</td><td>${money(v.abono)}</td><td>${money(saldo)}</td></tr>`;
    }).join('');

    const galeria = (urls, clase) => `<div class="galeria ${clase||''}">${urls.map(u => `<img src="${esc(u)}" data-lb="${esc(u)}" loading="lazy">`).join('')}</div>`;

    const bloquesVisitas = visitasRecientes.map(v => {
      const dep = pdfListaUrls(v.depositoFotoUrl), antes = pdfListaUrls(v.fotoAntesUrl), despues = pdfListaUrls(v.fotoDespuesUrl);
      return `
        <div class="card">
          <div class="sec" style="margin-top:0;"><div class="sec-bar">Sesión del ${formatearFechaBonita(v.fecha)} — Trabajo realizado</div>
            <div class="sec-body">
              <div class="fila"><span class="lbl">Tratamiento:</span><span>${esc(v.tratamiento) || '—'}</span></div>
              ${v.notas ? `<div class="fila"><span class="lbl">Notas:</span><span>${esc(v.notas)}</span></div>` : ''}
              <div class="fila"><span class="lbl">Abono de la sesión:</span><span><b>${money(v.abono)}</b></span></div>
            </div></div>
          ${dep.length ? `<div class="sec"><div class="sec-bar">Comprobante de depósito</div><div class="sec-body">${galeria(dep,'dep')}</div></div>` : ''}
          ${antes.length ? `<div class="sec"><div class="sec-bar">Fotos antes</div><div class="sec-body">${galeria(antes)}</div></div>` : ''}
          ${despues.length ? `<div class="sec"><div class="sec-bar">Fotos después</div><div class="sec-body">${galeria(despues)}</div></div>` : ''}
        </div>`;
    }).join('');

    const enCiclo = visitas.length % 5;
    const posicionActual = enCiclo === 0 ? (visitas.length > 0 ? 5 : 0) : enCiclo;
    const dots = Array.from({length:5}, (_, i) => `<div class="dot ${i < posicionActual ? 'filled' : ''}">${i === 4 ? '★' : i+1}</div>`).join('');

    app.innerHTML = `
      <div class="top-bar">
        <img src="${LOGO}" alt="Logo">
        <div><b>María José Tapia</b><span>Odontóloga — ${esc(data.paciente.nombre)}</span></div>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabReceta">💊 Receta</div>
        <div class="tab" id="tabComprobante">🧾 Comprobante de pago</div>
      </div>

      <div class="panel active" id="panelReceta">
        ${r ? `
          <div class="receta-doc">
            <div class="receta-header">
              <img src="${LOGO}" alt="Logo">
              <div><h2>María José Tapia</h2><div class="especialidad">Odontóloga</div></div>
            </div>
            <div class="receta-linea"></div>
            <div class="receta-campo"><b>Paciente:</b> ${esc(data.paciente.nombre)}</div>

        ` : '<p class="hint">Aún no hay ninguna receta registrada.</p>'}
      </div>

        <div class="card" style="padding:0;overflow:hidden;">
          <div class="doc-head"><img src="${LOGO}" alt=""><div><h2>Comprobante de pago</h2><p>${esc(data.paciente.nombre)}</p></div></div>
          <div style="padding:6px 18px 18px;">
            <div class="sec"><div class="sec-bar">Resumen de pagos</div>
              <div class="resumen-pagos">
                <div class="resumen-item"><div class="monto">${money(valor)}</div><div class="etiqueta">Valor del tratamiento</div></div>
                <div class="resumen-item"><div class="monto">${money(totalAbonado)}</div><div class="etiqueta">Abonado</div></div>
                <div class="resumen-item pendiente"><div class="monto">${money(pendiente)}</div><div class="etiqueta">Pendiente</div></div>
              </div>
            </div>
            <div class="sec"><div class="sec-bar">Historial de abonos</div>
              ${filasPagos ? `<table><thead><tr><th>Fecha</th><th>Tratamiento</th><th>Abono</th><th>Saldo</th></tr></thead><tbody>${filasPagos}</tbody></table>` : '<p class="hint">Aún no hay sesiones registradas.</p>'}
            </div>
            <div class="acciones"><button class="btn" id="btnPdfCompleto">📄 Descargar PDF completo</button></div>
            <p class="hint" style="margin:8px 0 0;">Un solo PDF con tu depósito, el tratamiento realizado, la receta y las fotos del antes y después.</p>
          </div>
        </div>

        ${bloquesVisitas}

        ${visitas.length ? `
          <div class="card">
            <div class="sec" style="margin-top:0;"><div class="sec-bar">Fidelización</div>
              <div class="sec-body"><p class="hint" style="margin-top:0;">${visitas.length} visita(s) registradas.</p><div class="loyalty-row">${dots}</div></div>
            </div>
          </div>` : ''}
      </div>

      <div class="lb" id="lb"><img alt="Foto ampliada"></div>
    `;

    document.getElementById('tabReceta').addEventListener('click', () => cambiarTab('Receta'));
    document.getElementById('tabComprobante').addEventListener('click', () => cambiarTab('Comprobante'));
    document.getElementById('lb').addEventListener('click', e => e.currentTarget.classList.remove('show'));
    app.querySelectorAll('[data-lb]').forEach(img => img.addEventListener('click', () => abrirLb(img.dataset.lb)));

    const btnImp = document.getElementById('btnImprimirReceta');
    if(btnImp){
      btnImp.addEventListener('click', () => {
        document.body.classList.add('print-receta');
        window.print();
      });
      window.addEventListener('afterprint', () => document.body.classList.remove('print-receta'));
    }
    document.getElementById('btnPdfCompleto').addEventListener('click', (e) => {
      descargarPdfCompleto({ paciente: data.paciente, visitas, valorTratamiento: valor, receta: r ? r.receta : '' }, e.currentTarget);
    });
  }

  function cambiarTab(nombre){
    ['Receta','Comprobante'].forEach(n => {
      document.getElementById('tab'+n).classList.toggle('active', n === nombre);
      document.getElementById('panel'+n).classList.toggle('active', n === nombre);
    });
  }

  cargar();
</script>
</body>
</html>
